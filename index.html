<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English Lessons | زبان نهم</title>

<style>
:root {
    --gold: #d6ad55;
    --black: #090909;
    --panel: #191919;
    --white: #f5f5f5;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--black);
    color: var(--white);
    font-family: Tahoma, Arial, sans-serif;
    line-height: 2;
}

header {
    text-align: center;
    padding: 30px 15px;
    background: linear-gradient(135deg, #080808, #302515);
    border-bottom: 2px solid var(--gold);
}

header h1 {
    color: var(--gold);
    margin: 0;
    font-size: 34px;
}

header p {
    color: #ddd;
}

.container {
    max-width: 1000px;
    margin: 25px auto;
    padding: 0 15px;
}

.card {
    background: var(--panel);
    border: 1px solid #51432a;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
}

h2, h3 {
    color: var(--gold);
}

button {
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--gold);
    border-radius: 9px;
    background: #222;
    color: white;
    padding: 10px 15px;
    margin: 4px;
    transition: 0.3s;
}

button:hover {
    background: #493b20;
}

button.active {
    background: var(--gold);
    color: #111;
    font-weight: bold;
}

.lesson-buttons,
.section-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
}

.lesson-buttons button {
    flex: 1;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin: 15px 0;
}

th, td {
    border: 1px solid #665333;
    padding: 9px;
    text-align: right;
}

th {
    color: var(--gold);
    background: #302515;
}

tr:nth-child(even) {
    background: #242424;
}

.english {
    direction: ltr;
    text-align: left;
    font-family: Arial, sans-serif;
}

.note {
    background: #282216;
    border-right: 3px solid var(--gold);
    padding: 12px;
    border-radius: 8px;
}

.answer {
    display: none;
    color: var(--gold);
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 25px;
    color: #aaa;
}

@media(max-width:600px) {
    header h1 {
        font-size: 26px;
    }

    .card {
        padding: 13px;
    }

    .lesson-buttons button {
        flex: 1 1 100%;
    }

    .section-buttons button {
        flex: 1 1 40%;
    }

    td, th {
        font-size: 13px;
        padding: 6px;
    }
}
</style>
</head>

<body>

<header>
    <h1>English Lessons</h1>
    <p>آموزش زبان انگلیسی پایه نهم</p>
</header>

<div class="container">

    <div class="lesson-buttons">
        <button class="active" onclick="selectLesson(0,this)">
            Lesson 1 - Personality
        </button>

        <button onclick="selectLesson(1,this)">
            Lesson 2 - Travel
        </button>

        <button onclick="selectLesson(2,this)">
            Lesson 3 - Festivals
        </button>
    </div>

    <div class="card">

        <h2 id="lessonTitle"></h2>
        <p id="lessonIntro"></p>

        <div class="section-buttons">
            <button class="active" onclick="showSection('overview',this)">
                معرفی درس
            </button>

            <button onclick="showSection('vocabulary',this)">
                واژگان جدید
            </button>

            <button onclick="showSection('grammar',this)">
                گرامر
            </button>

            <button onclick="showSection('conversation',this)">
                مکالمه
            </button>

            <button onclick="showSection('practice',this)">
                تمرین
            </button>
        </div>

        <div id="overview" class="section active"></div>
        <div id="vocabulary" class="section"></div>
        <div id="grammar" class="section"></div>
        <div id="conversation" class="section"></div>
        <div id="practice" class="section"></div>

    </div>
</div>

<footer>
    English Lessons | Grade 9
</footer>

function selectLesson(index, button) {

    const lesson = lessons[index];

    document.querySelectorAll(".lesson-buttons button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    document.getElementById("lessonTitle").textContent =
        lesson.title;

    document.getElementById("lessonIntro").textContent =
        lesson.intro;

    document.getElementById("overview").innerHTML =
        lesson.overview;

    document.getElementById("vocabulary").innerHTML =
        "<h3>واژگان جدید</h3>" +
        "<table><tr><th>English</th><th>معنی فارسی</th></tr>" +

        lesson.vocabulary.map(word =>
            "<tr><td class='english'>" +
            word[0] +
            "</td><td>" +
            word[1] +
            "</td></tr>"
        ).join("") +

        "</table>";

    document.getElementById("grammar").innerHTML =
        lesson.grammar;

    document.getElementById("conversation").innerHTML =
        lesson.conversation;

    document.getElementById("practice").innerHTML =
        lesson.practice;

    showSection(
        "overview",
        document.querySelector(".section-buttons button")
    );
}

function showSection(id, button) {

    document.querySelectorAll(".section")
        .forEach(section => section.classList.remove("active"));

    document.getElementById(id).classList.add("active");

    document.quer

ySelectorAll(".section-buttons button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");
}

function answer(id) {

    const element = document.getElementById(id);

    if (element) {
        element.style.display = "block";
    }
}

</html>
