<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Lessons | Grade 9</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>ENGLISH LESSONS</h1>
    <p>آموزش زبان انگلیسی پایه نهم</p>
  </header>

  <main class="container">
    <div class="card">
      <h2>انتخاب درس</h2>
      <div class="lesson-buttons">
        <button type="button" class="active" data-lesson="0">Lesson 1 - Personality</button>
        <button type="button" data-lesson="1">Lesson 2 - Travel</button>
        <button type="button" data-lesson="2">Lesson 3 - Festivals and Ceremonies</button>
      </div>
      <h2 id="lessonTitle">Lesson 1: Personality</h2>
      <p id="lessonIntro">درس اول: شخصیت و ویژگی‌های اخلاقی</p>
    </div>

    <div class="card">
      <h2>بخش‌های درس</h2>
      <div class="section-buttons">
        <button type="button" class="active" data-section="overview">معرفی درس</button>
        <button type="button" data-section="vocabulary">واژگان</button>
        <button type="button" data-section="grammar">گرامر</button>
        <button type="button" data-section="conversation">مکالمه</button>
        <button type="button" data-section="practice">تمرین</button>
      </div>

      <section id="overview" class="section active"><div id="overviewContent"></div></section>
      <section id="vocabulary" class="section"><div id="vocabularyContent"></div></section>
      <section id="grammar" class="section"><div id="grammarContent"></div></section>
      <section id="conversation" class="section"><div id="conversationContent"></div></section>
      <section id="practice" class="section"><div id="practiceContent"></div></section>
    </div>
  </main>
  <footer>English Lessons | Grade 9</footer>
</body>
</html>
