<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Lessons | Grade 9</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #090909;
    color: #eee;
    font-family: Tahoma, Arial, sans-serif;
    line-height: 2;
}

header {
    text-align: center;
    padding: 35px 15px;
    background: linear-gradient(135deg, #080808, #302515);
    border-bottom: 2px solid #d6ad55;
}

header h1 {
    color: #d6ad55;
    font-size: 32px;
    margin: 0;
    direction: ltr;
}

header p {
    color: #ddd;
    margin: 5px;
}

.container {
    max-width: 1050px;
    margin: 30px auto;
    padding: 0 15px;
}

.card {
    background: #171717;
    border: 1px solid #594827;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 22px;
    box-shadow: 0 5px 20px #000;
}

h2, h3 {
    color: #d6ad55;
}

.lesson-buttons,
.section-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-bottom: 20px;
}

button {
    background: #202020;
    color: #eee;
    border: 1px solid #b9954b;
    padding: 10px 17px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: .25s;
}

button:hover {
    background: #51401f;
    transform: translateY(-2px);
}

button.active {
    background: #d6ad55;
    color: #111;
    font-weight: bold;
}

.lesson-buttons button {
    flex: 1;
    direction: ltr;
}

.section {
    display: none;
    animation: appear .25s ease;
}

.section.active {
    display: block;
}

@keyframes appear {
    from { opacity: 0; }
    to { opacity: 1; }
}

.english {
    direction: ltr;
    text-align: left;
    font-family: Arial, sans-serif;
}

.note {
    background: #292216;
    border-right: 3px solid #d6ad55;
    padding: 12px;
    border-radius: 7px;
    margin: 15px 0;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin: 15px 0;
}

td, th {
    border: 1px solid #594827;
    padding: 9px;
    text-align: right;
}

th {
    background: #302515;
    color: #e5c274;
}

tr:nth-child(even) {
    background: #222;
}

.answer {
    display: none;
    color: #e5c274;
    font-weight: bold;
    padding: 8px;
}

footer {
    text-align: center;
    color: #aaa;
    padding: 25px;
    border-top: 1px solid #594827;
    margin-top: 35px;
}

@media(max-width:650px) {
    header h1 {
        font-size: 25px;
    }

    .card {
        padding: 14px;
    }

    .lesson-buttons button {
        flex: 1 1 100%;
    }

    .section-buttons button {
        flex: 1 1 40%;
    }

    table {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<header>
    <h1>ENGLISH LESSONS</h1>
    <p>آموزش زبان انگلیسی پایه نهم</p>
</header>

<main class="container">

    <div class="lesson-buttons">
        <button class="active" onclick="selectLesson(0,this)">Lesson 1 - Personality</button>
        <button onclick="selectLesson(1,this)">Lesson 2 - Travel</button>
        <button onclick="selectLesson(2,this)">Lesson 3 - Festivals and Ceremonies</button>
    </div>

    <div class="card">
        <h2 id="lessonTitle"></h2>
        <p id="lessonIntro"></p>

        <div class="section-buttons">
            <button class="active" onclick="showSection('overview',this)">معرفی درس</button>
            <button onclick="showSection('vocabulary',this)">واژگان</button>
            <button onclick="showSection('grammar',this)">گرامر</button>
            <button onclick="showSection('conversation',this)">مکالمه</button>
            <button onclick="showSection('practice',this)">تمرین</button>
        </div>

        <div id="overview" class="section active"></div>
        <div id="vocabulary" class="section"></div>
        <div id="grammar" class="section"></div>
        <div id="conversation" class="section"></div>
        <div id="practice" class="section"></div>
    </div>

</main>

<footer>
    English Lessons | Grade 9
</footer>

<script>
"use strict";

const lessons = [
{
    title: "Lesson 1: Personality",
    intro: "درس اول: شخصیت و ویژگی‌های اخلاق

ی",

    overview: [
        "<h3>Personality - شخصیت</h3>",
        "<p>در این درس با ویژگی‌های شخصیتی افراد آشنا می‌شویم.</p>",
        "<div class='note'>What is he like?<br>او چه‌جور آدمی است؟</div>"
    ].join(""),

    vocabulary: [
        ["personality","شخصیت"],
        ["clever","باهوش"],
        ["kind","مهربان"],
        ["hard-working","سخت‌کوش"],
        ["helpful","کمک‌کننده"],
        ["brave","شجاع"],
        ["angry","عصبانی"],
        ["careless","بی‌دقت"],
        ["cruel","بی‌رحم"],
        ["funny","بامزه"],
        ["neat","مرتب"],
        ["nervous","مضطرب"],
        ["quiet","ساکت"],
        ["rude","بی‌ادب"],
        ["selfish","خودخواه"],
        ["lazy","تنبل"],
        ["shy","خجالتی"],
        ["friendly","خوش‌برخورد"],
        ["polite","مؤدب"],
        ["patient","صبور"]
    ],

    grammar: [
        "<h3>Verb To Be</h3>",
        "<p>از am، is و are برای معرفی و توصیف استفاده می‌کنیم.</p>",
        "<table><tr><th>فاعل</th><th>فعل</th></tr>",
        "<tr><td>I</td><td>am</td></tr>",
        "<tr><td>He / She / It</td><td>is</td></tr>",
        "<tr><td>You / We / They</td><td>are</td></tr></table>",
        "<h3>مثال‌ها</h3>",
        "<p class='english'>I am clever.</p>",
        "<p>من باهوش هستم.</p>",
        "<p class='english'>She is kind.</p>",
        "<p>او مهربان است.</p>",
        "<p class='english'>They are helpful.</p>",
        "<p>آن‌ها کمک‌کننده هستند.</p>",
        "<h3>سوالی کردن</h3>",
        "<p class='english'>Is he shy?</p>",
        "<h3>منفی کردن</h3>",
        "<p class='english'>He is not shy.</p>"
    ].join(""),

    conversation: [
        "<h3>Conversation</h3>",
        "<p class='english'>A: Who is your best friend?</p>",
        "<p class='english'>B: Reza is my best friend.</p>",
        "<p class='english'>A: What is he like?</p>",
        "<p class='english'>B: He is clever and kind.</p>",
        "<div class='note'>مکالمه نمونه تمرینی</div>"
    ].join(""),

    practice: [
        "<h3>تمرین درس اول</h3>",
        "<p>۱. جای خالی را کامل کن:</p>",
        "<p class='english'>She _ kind.</p>",
        "<button onclick=\"answer('a1')\">نمایش جواب</button>",
        "<p class='answer' id='a1'>is</p>",
        "<p>۲. معنی hard-working چیست؟</p>",
        "<button onclick=\"answer('a2')\">نمایش جواب</button>",
        "<p class='answer' id='a2'>سخت‌کوش</p>",
        "<p>۳. جمله را منفی کن: He is shy.</p>",
        "<button onclick=\"answer('a3')\">نمایش جواب</button>",
        "<p class='answer' id='a3'>He is not shy.</p>"
    ].join("")
},

{
    title: "Lesson 2: Travel",
    intro: "درس دوم: سفر و گردشگری",

    overview: [
        "<h3>Travel - سفر</h3>",
        "<p>در این درس با واژگان مربوط به سفر، هتل و فرودگاه آشنا می‌شویم.</p>",
        "<div class='note'>Present Continuous - زمان حال استمراری</div>"
    ].join(""),

    vocabulary: [
        ["travel","سفر کردن"],
        ["tourist","گردشگر"],
        ["trip","سفر"],
        ["hotel","هتل"],
        ["reservation","رزرو"],
        ["receptionist","مسئول پذیرش"],
        ["passport","گذرنامه"],
        ["room","اتاق"],
        ["airport","فرودگاه"],
        ["stay","اقامت کردن"],
        ["enjoy","لذت بردن"],
        ["visit","بازدید کردن"],
        ["ticket","بلیت"],
        ["key","کلید"],
        ["gift shop","فروشگاه هدیه"],
        ["wife","همسر"],
        ["husband","شوهر"],
        ["daughter","دختر"],
        ["land","فرود آمدن"],
        ["take off","بلند شدن هواپیما"]
    ],

    grammar: [
        "<h3>Present Continuous</h3>",
        "<p>برای کاری که در همین لحظه در حال انجام است استفاده می‌شود.</p>",
        "<div class='note english'>Subject + am / is / are + verb-ing</div>",
        "<h3>مثال‌ها</h3>",
        "<p class='english'>I am reading.</p>",
        "<p>من در حال خواندن هستم.</p>",
        "<p class='english'>She is writing.</p>",
        "<p>او در حال نوشتن است.</p>",
        "<p class='english'>They are traveling.</p>",
        "<p>آن‌ها در حال سفر هستند.</p>",
        "<h3>منفی</h3>",
        "<p class='english'>He is not sleeping.</p>",
        "<h3>سوالی</h3>",

"<p class='english'>Are you studying?</p>"
    ].join(""),

    conversation: [
        "<h3>Conversation at a Hotel</h3>",
        "<p class='english'>Receptionist: Welcome to our hotel.</p>",
        "<p class='english'>Guest: I have a reservation.</p>",
        "<p class='english'>Receptionist: Are you staying for two nights?</p>",
        "<p class='english'>Guest: Yes, my wife and I are visiting Tehran.</p>",
        "<div class='note'>مکالمه نمونه تمرینی</div>"
    ].join(""),

    practice: [
        "<h3>تمرین درس دوم</h3>",
        "<p>۱. جای خالی را کامل کن:</p>",
        "<p class='english'>They _ traveling.</p>",
        "<button onclick=\"answer('b1')\">نمایش جواب</button>",
        "<p class='answer' id='b1'>are</p>",
        "<p>۲. معنی passport چیست؟</p>",
        "<button onclick=\"answer('b2')\">نمایش جواب</button>",
        "<p class='answer' id='b2'>گذرنامه</p>",
        "<p>۳. جمله را پرسشی کن: She is reading.</p>",
        "<button onclick=\"answer('b3')\">نمایش جواب</button>",
        "<p class='answer' id='b3'>Is she reading?</p>"
    ].join("")
},

{
    title: "Lesson 3: Festivals and Ceremonies",
    intro: "درس سوم: جشنواره‌ها و مراسم",

    overview: [
        "<h3>Festivals and Ceremonies</h3>",
        "<p>در این درس درباره جشن‌ها، تعطیلات، نوروز و آداب و رسوم صحبت می‌کنیم.</p>",
        "<div class='note'>New Year Holidays - تعطیلات سال نو</div>"
    ].join(""),

    vocabulary: [
        ["festival","جشنواره"],
        ["ceremony","مراسم"],
        ["holiday","تعطیلات"],
        ["New Year","سال نو"],
        ["Norooz","نوروز"],
        ["relative","خویشاوند"],
        ["relatives","اقوام"],
        ["gift","هدیه"],
        ["grandparents","پدربزرگ و مادربزرگ"],
        ["grandmother","مادربزرگ"],
        ["grandfather","پدربزرگ"],
        ["meal","وعده غذایی"],
        ["special","ویژه"],
        ["spring","بهار"],
        ["goldfish","ماهی قرمز"],
        ["Haft Seen table","سفره هفت‌سین"],
        ["Nature Day","روز طبیعت"],
        ["nuts","آجیل"],
        ["visit relatives","دیدار اقوام"],
        ["get gifts","هدیه گرفتن"]
    ],

    grammar: [
        "<h3>Simple Present</h3>",
        "<p>از زمان حال ساده برای عادت‌ها و کارهای تکراری استفاده می‌کنیم.</p>",
        "<div class='note english'>I / You / We / They + verb</div>",
        "<div class='note english'>He / She / It + verb-s/es</div>",
        "<h3>مثال‌ها</h3>",
        "<p class='english'>We visit our relatives.</p>",
        "<p>ما به دیدن اقواممان می‌رویم.</p>",
        "<p class='english'>She cooks dinner.</p>",
        "<p>او شام می‌پزد.</p>",
        "<h3>منفی</h3>",
        "<p class='english'>I don't watch TV.</p>",
        "<p class='english'>She doesn't cook.</p>",
        "<h3>سوالی</h3>",
        "<p class='english'>Do you like spring?</p>",
        "<p class='english'>Does he study English?</p>"
    ].join(""),

    conversation: [
        "<h3>Conversation about Norooz</h3>",
        "<p class='english'>A: Do you enjoy New Year holidays?</p>",
        "<p class='english'>B: Yes, I do.</p>",
        "<p class='english'>A: Do you visit your relatives?</p>",
        "<p class='english'>B: Yes, I do.</p>",
        "<div class='note'>مکالمه نمونه تمرینی</div>"
    ].join(""),

    practice: [
        "<h3>تمرین درس سوم</h3>",
        "<p>۱. جای خالی را کامل کن:</p>",
        "<p class='english'>She _ English every day.</p>",
        "<button onclick=\"answer('c1')\">نمایش جواب</button>",
        "<p class='answer' id='c1'>studies</p>",
        "<p>۲. جای خالی را کامل کن:</p>",
        "<p class='english'>___ you visit your relatives?</p>",
        "<button onclick=\"answer('c2')\">نمایش جواب</button>",
        "<p class='answer' id='c2'>Do</p>",
        "<p>۳. جای خالی را کامل کن:</p>",
        "<p class='english'>They love _ grandparents.</p>",
        "<button onclick=\"answer('c3')\">نمایش جواب</button>",
        "<p class='answer' id='c3'>their</p>"
    ].join("")
}
];

function selectLesson(index, button) {
    const lesson = lessons[index];

    if (!lesson) return;

    document.querySelector

All(".lesson-buttons button")
        .forEach(function(btn) {
            btn.classList.remove("active");
        });

    button.classList.add("active");

    document.getElementById("lessonTitle").textContent = lesson.title;
    document.getElementById("lessonIntro").textContent = lesson.intro;

    document.getElementById("overview").innerHTML = lesson.overview;

    let vocabularyHTML = "<h3>واژگان جدید</h3>";
    vocabularyHTML += "<table><tr><th>English</th><th>معنی فارسی</th></tr>";

    lesson.vocabulary.forEach(function(word) {
        vocabularyHTML += "<tr><td class='english'>" +
            word[0] + "</td><td>" + word[1] + "</td></tr>";
    });

    vocabularyHTML += "</table>";

    document.getElementById("vocabulary").innerHTML = vocabularyHTML;
    document.getElementById("grammar").innerHTML = lesson.grammar;
    document.getElementById("conversation").innerHTML = lesson.conversation;
    document.getElementById("practice").innerHTML = lesson.practice;

    const firstSectionButton = document.querySelector(".section-buttons button");
    showSection("overview", firstSectionButton);
}

function showSection(id, button) {
    document.querySelectorAll(".section").forEach(function(section) {
        section.classList.remove("active");
    });

    const selected = document.getElementById(id);

    if (selected) {
        selected.classList.add("active");
    }

    document.querySelectorAll(".section-buttons button").forEach(function(btn) {
        btn.classList.remove("active");
    });

    if (button) {
        button.classList.add("active");
    }
}

function answer(id) {
    const element = document.getElementById(id);

    if (element) {
        element.style.display = "block";
    }
}

selectLesson(0, document.querySelector(".lesson-buttons button"));

</script>

</body>
</html>
